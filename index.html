<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>national</title>
    <style>
        :root { --bg: #0f0f0f; --panel: #1a1a1a; --accent: #00d4ff; --gold: #ffcc00; --text: #e0e0e0; }
        body { font-family: 'Consolas', 'Monaco', monospace; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        
        .control-panel { background: var(--panel); padding: 20px; border-radius: 8px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        input { padding: 10px; background: #000; border: 1px solid var(--accent); color: var(--accent); font-weight: bold; width: 200px; }
        button { padding: 10px 20px; background: var(--accent); color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:hover { filter: brightness(1.2); }
        button.dl { background: var(--gold); }
        button.copy { background: #fff; }

        #log-output { background: #000; border: 1px solid #333; padding: 20px; border-radius: 8px; height: 400px; overflow-y: scroll; white-space: pre-wrap; font-size: 0.85em; color: #00ff00; margin-bottom: 20px; }
        
        .footer { text-align: center; font-size: 0.7em; color: #555; margin-top: 40px; }
        .status-msg { color: var(--gold); margin-bottom: 10px; display: block; height: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ドイツ愛好会</h1>
        <small>Extraction Unit: Seisen-01</small>
    </div>

    <div class="control-panel">
        <input type="number" id="uid" placeholder="UIDを入力" value="">
        <button onclick="App.run()">データ抽出</button>
        <button class="copy" onclick="App.copyToClipboard()">テキストをコピー</button>
    </div>

    <div class="control-panel" style="background: #111; border: 1px solid #333;">
        <span style="width: 100%; text-align: center; font-size: 0.8em; margin-bottom: 5px;">DOWNLOAD RECORD</span>
        <button class="dl" onclick="App.download('json')">JSON</button>
        <button class="dl" onclick="App.download('csv')">CSV</button>
        <button class="dl" onclick="App.download('txt')">TXT</button>
        <button class="dl" onclick="App.download('html')">HTML</button>
    </div>

    <span id="status" class="status-msg">待機中...</span>
    <div id="log-output">UIDを入力して開始してください。</div>

    <div class="footer">
        Powered by Enka.Network API | Archiver Mode v1.0
    </div>
</div>

<script>
const CONFIG = {
    PROXY_URL: "https://corsproxy.io/?",
    ENKA_API: "https://enka.network/api/uid/",
    WEBHOOK_URL: "GH_SECRET_WEBHOOK_PLACEHOLDER"
};

const App = {
    currentData: null,
    logContent: "",

    updateStatus(msg) { document.getElementById('status').innerText = `>> ${msg}`; },

    async run() {
        const uid = document.getElementById('uid').value;
        if (!uid) return alert("UIDを入力してください");

        this.updateStatus("情報抽出中...");
        const output = document.getElementById('log-output');
        output.innerText = "Accessing Enka.Network Data Base...\n";

        try {
            const res = await fetch(CONFIG.PROXY_URL + encodeURIComponent(CONFIG.ENKA_API + uid));
            const data = await res.json();
            if (!data.playerInfo) throw new Error("対象のデータが空、または非公開です。");

            this.currentData = data;
            this.buildLog(data);
            output.innerText = this.logContent;
            this.updateStatus("成功しました");
        } catch (e) {
            output.innerText += `\n[ERROR] ${e.message}`;
            this.updateStatus("エラー発生");
        }
    },

    buildLog(data) {
        const p = data.playerInfo;
        let log = `プレイヤー記録\n`;
        log += `名前: ${p.nickname}\n`;
        log += `冒険ランク: ${p.level} / 世界ランク: ${p.worldLevel || 0}\n`;
        log += `アチーブメント達成数: ${p.finishAchievementNum || 0}\n`;
        log += `深境螺旋: ${p.towerFloorIndex}-${p.towerLevelIndex}\n`;
        log += `自己紹介: ${p.signature || 'なし'}\n`;
        log += `------------------------------------------\n`;
        log += `キャラクターと配備アイテムの詳細\n`;

        if (data.avatarInfoList) {
            data.avatarInfoList.forEach(av => {
                log += `\nキャラクター: ${av.avatarId} \n`;
                av.equipList.forEach(eq => {
                    if (eq.flat.nameTextMapHash) {
                        const name = eq.flat.setNameTextMapHash || "アイテム";
                        log += `  - [${eq.flat.equipType}] ${eq.flat.nameTextMapHash}\n`;
                        if (eq.reliquary) {
                            eq.flat.reliquarySubstats?.forEach(sub => {
                                log += `    * ${sub.appendPropId}: +${sub.statValue}\n`;
                            });
                        }
                    }
                });
            });
        }
        this.logContent = log;
    },

    download(type) {
        if (!this.currentData) return alert("データを抽出してください");
        const uid = this.currentData.uid || "data";
        let content = "";
        let mime = "text/plain";
        let ext = type;

        if (type === 'json') {
            content = JSON.stringify(this.currentData, null, 2);
            mime = "application/json";
        } else if (type === 'txt') {
            content = this.logContent;
        } else if (type === 'csv') {
            content = "Category,Key,Value\n";
            content += `Player,Nickname,${this.currentData.playerInfo.nickname}\n`;
            content += `Player,Level,${this.currentData.playerInfo.level}\n`;
            this.currentData.avatarInfoList?.forEach(av => {
                content += `Character,ID,${av.avatarId}\n`;
            });
            mime = "text/csv";
        } else if (type === 'html') {
            content = `<html><body style="background:#000;color:#0f0;font-family:monospace;"><pre>${this.logContent}</pre></body></html>`;
            mime = "text/html";
        }

        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `GERMANY_CLUB_REPORT_${uid}.${ext}`;
        a.click();
    },

    copyToClipboard() {
        if (!this.logContent) return;
        navigator.clipboard.writeText(this.logContent);
        alert("クリップボードにデータをコピーしました。");
    }
};
</script>
</body>
</html>
